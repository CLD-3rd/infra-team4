<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="/css/dashboard/change-password.css">
</head>
<body>
<div class="container">
    <h1>비밀번호 변경</h1>
    <form id="passwordForm">
        <input type="password" name="originPassword" placeholder="기존 비밀번호" required />
        <input type="password" name="newPassword" placeholder="새 비밀번호" required />
        <input type="password" name="newPasswordConfirm" placeholder="비밀번호 확인" required />
        <button type="submit">저장</button>
    </form>
    <div class="message" id="messageBox"></div>
</div>

<script src="/js/dashboard/change-password.js"></script>
</body>
</html>
