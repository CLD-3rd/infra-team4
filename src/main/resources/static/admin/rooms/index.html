<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Room Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>룸 관리</h1>
  <section id="create-room">
    <input type="text" id="new-room-number" placeholder="새 룸 번호" />
    <button id="btn-create">등록</button>
  </section>
  <table id="room-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Room Number</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="reservation-modal" class="hidden">
    <h2>예약 목록 for <span id="modal-room-number"></span></h2>
    <ul id="reservation-list"></ul>
    <button id="btn-close-modal">닫기</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
