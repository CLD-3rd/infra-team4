<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>룸 관리</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 좌측 상단 로고 -->
  <div class="psr-logo" onclick="window.location.href='/dashboard.html'">PSR</div>

  <!-- 우측 상단 프로필 -->
  <div class="profile-wrapper" id="profileWrapper">
    <img
      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      alt="프로필 사진"
      class="profile-pic"
      id="profilePic"
    />
    <div class="profile-menu" id="profileMenu">
      <button id="profileSettingsBtn">프로필 설정</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <h1>룸 관리</h1>

    <!-- 룸 등록 폼 -->
    <div class="card">
      <input type="text" id="new-room-number" placeholder="새 룸 번호" class="input" />
      <button id="btn-create" class="btn">등록</button>
    </div>

    <!-- 룸 목록 그리드 -->
    <div class="grid" id="room-grid">
      <!-- JS로 채워집니다 -->
    </div>
  </div>

  <div id="reservation-modal" class="modal hidden" hidden>
    <div class="modal-content">
      <h2>예약 목록 for <span id="modal-room-number"></span></h2>
      <ul id="reservation-list"></ul>
      <button id="btn-close-modal" class="btn">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // 프로필 메뉴 토글
    const profileWrapper = document.getElementById('profileWrapper');
    const profileMenu = document.getElementById('profileMenu');
    profileWrapper.addEventListener('click', () => {
      profileMenu.classList.toggle('active');
    });
    window.addEventListener('click', (e) => {
      if (!profileWrapper.contains(e.target)) {
        profileMenu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
