spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/room_reservation?&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: app
    password: app # 숫자만 있는 경우 따옴표로 감싸는 것이 안전

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
      hibernate:
        SQL: debug
        orm.jdbc.bind: trace

